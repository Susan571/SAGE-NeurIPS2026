[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-long-horizon-reasoning"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
llm = ["accelerate>=1.0", "datasets>=3.0", "pyyaml>=6.0", "transformers>=5.12.0"]

[tool.setuptools]
packages = ["llm_sage"]
py-modules = ["train_llm", "eval_llm"]

[project.scripts]
sage-llm-train = "train_llm:main"
sage-llm-eval = "eval_llm:main"
